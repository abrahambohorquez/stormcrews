[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stormcrews"
version = "0.3.0"
description = "An open simulator of distribution restoration after storms: repair crews, mutual aid and restoration rules on 85 real storms, with results in reliability terms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Abraham Jesús Bohórquez Gómez" },
    { name = "Juan José Murillo Aristizábal" },
    { name = "Alejandra Tabares Pozos" },
    { name = "Pablo José Cortés Sanabria" },
]
keywords = ["power distribution", "reliability", "SAIDI", "resilience", "storm restoration", "repair crews",
            "mutual aid", "outages", "discrete-event simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/abrahambohorquez/stormcrews"
Documentation = "https://github.com/abrahambohorquez/stormcrews#readme"
Issues = "https://github.com/abrahambohorquez/stormcrews/issues"
Changelog = "https://github.com/abrahambohorquez/stormcrews/blob/main/CHANGELOG.md"

[project.optional-dependencies]
maps = ["geopandas>=0.14"]
notebook = ["ipywidgets>=8", "ipykernel>=6", "jupyterlab>=4", "geopandas>=0.14"]
dev = ["pytest>=7", "geopandas>=0.14", "pillow>=10", "statsmodels>=0.14", "ipywidgets>=8"]

[project.scripts]
stormcrews = "stormcrews.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "DATA_LICENSE.md"]

[tool.setuptools.packages.find]
include = ["stormcrews*"]

[tool.setuptools.package-data]
stormcrews = ["data/*.npz", "data/*.csv", "data/*.json", "data/*.gpkg", "data/*.md", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
